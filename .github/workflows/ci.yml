name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block high-severity production dependency advisories
        run: npm run audit:prod

      - name: Run unit and domain tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build
        env:
          AUTH_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}-auth
          AUTH_TRUST_HOST: "true"
          ENABLE_DEVELOPER_TOOLS: "true"

      - name: Export evaluation governance artifacts
        shell: bash
        env:
          AI_EVALUATION_REPORT_BASE_URL: http://127.0.0.1:3000
          AI_EVALUATION_REPORT_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}-evaluation-report
          AUTH_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}-auth
          AUTH_TRUST_HOST: "true"
          ENABLE_DEVELOPER_TOOLS: "true"
          ENABLE_PUBLIC_DEMO_ACCOUNT: "true"
          DEMO_ACCOUNT_EMAIL: demo.learner@example.com
          DEMO_ACCOUNT_PASSWORD: "ci-demo-${{ github.run_id }}-${{ github.run_attempt }}-Password!"
          DEMO_ACCOUNT_NAME: Portfolio Demo Learner
          DEMO_BASE_URL: http://127.0.0.1:3000
        run: |
          npm start -- -p 3000 > /tmp/ai-learning-platform.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              ready=true
              break
            fi
            sleep 0.5
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/ai-learning-platform.log
            exit 1
          fi

          npm run demo:seed
          login_html=$(curl --fail --silent http://127.0.0.1:3000/login)
          grep --quiet "Log in as demo learner" <<< "$login_html"

          npm run report:evaluation -- --output artifacts/ai-evaluation-report.json
          npm run report:evaluation -- --format markdown --output artifacts/ai-evaluation-report.md

      - name: Upload evaluation governance report
        uses: actions/upload-artifact@v7
        with:
          name: ai-evaluation-governance-report
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
