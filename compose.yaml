services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SHOW_AI_TRACE: ${NEXT_PUBLIC_SHOW_AI_TRACE:-false}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in your Compose env file}
      AUTH_TRUST_HOST: "true"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      TEACHER_WORKFLOW_ENGINE: ${TEACHER_WORKFLOW_ENGINE:-langgraph}
      AI_TEACHER_BURST_LIMIT: ${AI_TEACHER_BURST_LIMIT:-12}
      AI_TEACHER_BURST_WINDOW_SECONDS: ${AI_TEACHER_BURST_WINDOW_SECONDS:-600}
      AI_TEACHER_DAILY_LIMIT: ${AI_TEACHER_DAILY_LIMIT:-100}
      AI_RUN_RETENTION_DAYS: ${AI_RUN_RETENTION_DAYS:-90}
      RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-hybrid}
      RAG_KEYWORD_MIN_SCORE: ${RAG_KEYWORD_MIN_SCORE:-4}
      RAG_EMBEDDING_MIN_SCORE: ${RAG_EMBEDDING_MIN_SCORE:-48}
      RAG_HYBRID_MIN_SCORE: ${RAG_HYBRID_MIN_SCORE:-20}
      RAG_HYBRID_KEYWORD_WEIGHT: ${RAG_HYBRID_KEYWORD_WEIGHT:-65}
      RAG_HYBRID_EMBEDDING_WEIGHT: ${RAG_HYBRID_EMBEDDING_WEIGHT:-35}
      NEXT_PUBLIC_SHOW_AI_TRACE: ${NEXT_PUBLIC_SHOW_AI_TRACE:-false}
      ENABLE_DEVELOPER_TOOLS: ${ENABLE_DEVELOPER_TOOLS:-false}
      DEVELOPER_MODE_PASSWORD: ${DEVELOPER_MODE_PASSWORD:-}
      ENABLE_PUBLIC_DEMO_ACCOUNT: ${ENABLE_PUBLIC_DEMO_ACCOUNT:-false}
      DEMO_ACCOUNT_EMAIL: ${DEMO_ACCOUNT_EMAIL:-}
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:-}
      DEMO_ACCOUNT_NAME: ${DEMO_ACCOUNT_NAME:-Portfolio Demo Learner}
      AI_EVALUATION_REPORT_SECRET: ${AI_EVALUATION_REPORT_SECRET:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai-compatible}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_INDEX_SECRET: ${EMBEDDING_INDEX_SECRET:-}
    volumes:
      - ai-learning-data:/app/data
    restart: unless-stopped

volumes:
  ai-learning-data:
