# 复制本文件并填写。未确定的字段写 null，不要猜测。

course:
  title: null
  course_id: null # kebab-case，例如 javascript-foundations
  short_title: null
  subject: null
  description: null
  level: null
  status: preview # available | preview | archived
  tags: []

learners:
  audience: null
  assumed_prior_knowledge: []
  age_or_stage: null
  learning_context: null # 自学、校内补充、考试准备、职业培训等

scope:
  included_topics: []
  excluded_topics: []
  final_learning_outcomes: []
  estimated_total_minutes: null

language:
  canonical_language: en
  localization_languages:
    - zh
  terminology_policy: null
  localization_profiles:
    zh:
      locale_variant: zh-CN
      strategy: adaptive_rewrite # 中文教学改写，不按英文逐句对齐
      audience: null
      register: null # 例如：自然、简洁、适合高中课堂的现代汉语
      allow_sentence_restructuring: true
      allow_cultural_adaptation: true
      preserve:
        - learning_outcomes
        - factual_accuracy
        - domain_notation
        - misconception_targets
        - assessment_correctness
      quality_criteria:
        - 允许调整语序、段落结构并拆分过长句子。
        - 文化场景可替换为学习者熟悉且认知要求等价的情境。
        - 中文应像教师直接讲解，不保留生硬的翻译句式。

teaching_profile:
  role: null
  tone: null
  learning_priorities: []
  example_style: null
  misconception_strategy: null

units:
  - title: null
    unit_id: null
    delivery_status: planned # planned | implemented | reviewed
    continues_from_unit_ids: [] # 后续单元必须引用前面的路线图单元
    required_prior_concept_ids: [] # 来自前置单元的概念 ID
    description: null
    estimated_minutes: null
    topics:
      - title: null
        topic_id: null
        description: null
        concepts:
          - title: null
            concept_id: null
            description: null
            difficulty: foundational # foundational | developing | advanced
            estimated_minutes: null
            prerequisite_concept_ids: []
            learning_outcomes: []
            common_misconceptions: []

assessment:
  enabled: true
  questions_per_phase: 2
  phases:
    - diagnostic
    - exit_ticket
  localization_required: true

visualization:
  enabled: false
  required_concept_ids: []
  notes: null

content_constraints:
  required_sources_or_standards: []
  prohibited_claims_or_topics: []
  citation_requirements: null
  accessibility_requirements: []

delivery:
  roadmap_version: 1 # 规划结构或衔接关系变化时递增
  mode: unit_by_unit # unit_by_unit | full_course
  target_unit_id: null # 每次只指定一个 planned 单元；全部完成后为 null
  target_release: null
  reviewer: null
  notes: null
